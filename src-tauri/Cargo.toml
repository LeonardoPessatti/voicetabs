[package]
name = "voicetabs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "VoiceTabs - dictation-driven tabbed editor"
default-run = "voicetabs"

[lib]
name = "voicetabs_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
directories = "5"
hound = "3.5"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "download-binaries"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
voice_activity_detector = "0.2.1"
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "stub_worker"
path = "tests/fixtures/stub_worker.rs"
required-features = []
