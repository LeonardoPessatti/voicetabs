name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # whisper-rs-sys calls bindgen at build time, which needs libclang.
      # The shipped pre-generated bindings are Linux-only (glibc ABI), so on
      # Windows MSVC we MUST run bindgen — therefore LLVM is required.
      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}/llvm

      # whisper-rs-sys uses cmake to build the bundled whisper.cpp sources.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm deps
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend bundle (needed for tauri::generate_context!)
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build app
        run: npm run tauri build -- --debug
