name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # whisper-rs-sys calls bindgen at build time, which needs libclang.
      # The shipped pre-generated bindings are Linux-only (glibc ABI), so on
      # Windows MSVC we MUST run bindgen — therefore LLVM is required.
      - name: Install LLVM (libclang for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
          directory: ${{ runner.temp }}/llvm

      # whisper-rs-sys uses cmake to build the bundled whisper.cpp sources.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm deps
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build frontend bundle (needed for tauri::generate_context!)
        run: npm run build

      # Tauri's build script validates the externalBin path BEFORE compiling
      # the main crate. The path in tauri.conf.json is target/release/...,
      # so the release worker binary must exist before `cargo test` runs.
      - name: Build stt_worker (CPU) for externalBin pre-check
        shell: pwsh
        run: |
          cargo build --release -p stt_worker --bin stt_worker_cpu
          $triple = 'x86_64-pc-windows-msvc'
          Copy-Item target/release/stt_worker_cpu.exe "target/release/stt_worker_cpu-$triple.exe"

      # bundle.resources in tauri.conf.json points at the ~574 MB Whisper
      # model. That file is gitignored, so CI has nothing to satisfy the
      # tauri-build resource-existence pre-check. A zero-byte placeholder
      # passes the check. The bundle never gets installed/run on CI; the
      # smoke build is only verifying that the source compiles + bundles.
      - name: Stub model file for bundle pre-check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          New-Item -ItemType File -Force -Path src-tauri/resources/ggml-small-q5_1.bin | Out-Null

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build app
        run: npm run tauri build -- --debug
